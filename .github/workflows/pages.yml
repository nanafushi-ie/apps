name: Deploy apps to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storage/package-lock.json
      - run: npm ci
        working-directory: storage
      - run: npm run build
        working-directory: storage
      - name: Assemble Pages site
        run: |
          mkdir -p _site/storage
          cp -R storage/dist/. _site/storage/
          mv _site/storage/index.source.html _site/storage/index.html
          if [ -d madori ]; then cp -R madori _site/madori; fi
          if [ -d solar ]; then cp -R solar _site/solar; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
