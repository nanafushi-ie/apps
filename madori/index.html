            legacy: { key: 'legacy', label: '従来形式', unitSizeMm: LEGACY_UNIT_SIZE_MM, description: '1目盛り = 250mm' }
        };
        const PASSWORD_SALT_BASE64 = 'rMwBf8znbsWR0N2LKb1+og==';
        const PASSWORD_HASH_BASE64 = 'VqRUuiLZ+ZiwwthyeO8JzDwCziBNOwnqoX5CrWifAsI=';
        const PASSWORD_ITERATIONS = 310000;
        const AUTH_COOKIE_NAME = 'madori_authenticated_v2';
        const AUTH_COOKIE_VALUE = 'pbkdf2-v1';
        const AUTH_COOKIE_MAX_AGE = 60 * 60 * 24 * 365;

        const hasAuthCookie = () => document.cookie
            .split(';')
            .map(cookie => cookie.trim())
            .some(cookie => cookie === `${AUTH_COOKIE_NAME}=${AUTH_COOKIE_VALUE}`);

        const saveAuthCookie = () => {
            const secure = window.location.protocol === 'https:' ? '; Secure' : '';
            document.cookie = `${AUTH_COOKIE_NAME}=${AUTH_COOKIE_VALUE}; Path=/; Max-Age=${AUTH_COOKIE_MAX_AGE}; SameSite=Lax${secure}`;
        };

        const decodeBase64 = (value) => Uint8Array.from(atob(value), char => char.charCodeAt(0));

        const verifyPassword = async (password) => {
            if (!window.crypto?.subtle) {
                throw new Error('このブラウザではパスワード認証を利用できません。');
            }

            const passwordKey = await window.crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveBits']
            );
            const derivedBits = await window.crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: decodeBase64(PASSWORD_SALT_BASE64),
                    iterations: PASSWORD_ITERATIONS,
                    hash: 'SHA-256'
                },
                passwordKey,
                256
            );
            const actual = new Uint8Array(derivedBits);
            const expected = decodeBase64(PASSWORD_HASH_BASE64);

            if (actual.length !== expected.length) return false;
            let difference = 0;
            for (let i = 0; i < actual.length; i += 1) {
                difference |= actual[i] ^ expected[i];
            }
            return difference === 0;
        };

        const DimensionInput = ({ label, value, onCommit, stepMm = LEGACY_UNIT_SIZE_MM, large = false }) => {
            const [draft, setDraft] = useState(String(value));

            useEffect(() => {
                setDraft(String(value));
            }, [value]);

            const commit = (rawValue = draft) => {
                const numeric = Number(String(rawValue).replace(/[^\d]/g, ''));
                const safeValue = Number.isFinite(numeric) && numeric > 0 ? numeric : value;
                onCommit(safeValue);
            };

            const stepBy = (delta) => {
                const nextValue = Math.max(stepMm, value + delta);
                setDraft(String(nextValue));
                onCommit(nextValue);
            };

            return (
                <div>
                    <label className="text-[9px] font-black text-slate-500 uppercase block mb-1">{label}</label>
                    <div className="flex overflow-hidden rounded-xl border bg-white focus-within:ring-4 focus-within:ring-indigo-50">
                        <input
                            type="text"
                            inputMode="numeric"
                            pattern="[0-9]*"
                            value={draft}
                            onChange={(e) => setDraft(e.target.value.replace(/[^\d]/g, ''))}
                            onBlur={() => commit()}
                            onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                    e.currentTarget.blur();
                                }
                            }}
                            className={`dimension-input min-w-0 flex-1 border-0 bg-white px-3 outline-none font-bold ${large ? 'py-3 text-base sm:text-lg' : 'py-2 text-base'}`}
                        />
                        <div className="flex flex-col border-l border-slate-200">
                            <button type="button" onClick={() => stepBy(stepMm)} className="w-10 flex-1 min-h-[24px] bg-slate-50 text-slate-700 font-black leading-none active:bg-indigo-50">+</button>
                            <button type="button" onClick={() => stepBy(-stepMm)} className="w-10 flex-1 min-h-[24px] bg-slate-50 text-slate-700 font-black leading-none border-t border-slate-200 active:bg-indigo-50">-</button>

                    </div>

            );
        };

        const PasswordGate = ({ children }) => {
            const [isAuthenticated, setIsAuthenticated] = useState(hasAuthCookie);
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [isChecking, setIsChecking] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsChecking(true);
                setError('');

                try {
                    if (await verifyPassword(password)) {
                        saveAuthCookie();
                        setIsAuthenticated(true);
                        setPassword('');
                        return;
                    }
                    setError('パスワードが正しくありません。');
                } catch (authError) {
                    setError(authError.message || 'パスワードを確認できませんでした。');
                } finally {
                    setIsChecking(false);
                }
            };

            if (isAuthenticated) return children;

            return (
                <div className="app-shell flex items-center justify-center bg-slate-100 p-4 font-sans text-slate-900">

                            }}
                            autoComplete="current-password"
                            autoFocus
                            disabled={isChecking}
                            aria-invalid={Boolean(error)}
                            aria-describedby={error ? 'password-error' : undefined}
                            className="w-full rounded-xl border border-slate-200 px-4 py-3 text-base font-bold outline-none transition focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50"
                        />

                        {error && (
                            <p id="password-error" role="alert" className="mt-2 text-xs font-bold text-red-500">
                                {error}
                            </p>
                        )}

                        <button type="submit" disabled={isChecking || !password} className="mt-5 w-full rounded-xl bg-indigo-600 py-3.5 text-sm font-black text-white shadow-lg transition hover:bg-indigo-700 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60">

                        <p className="mt-4 text-center text-[10px] font-bold text-slate-400">

        };

        const App = () => {
            const [elements, setElements] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [moduleKey, setModuleKey] = useState('tatami');
            const [unitSizeMm, setUnitSizeMm] = useState(MODULE_OPTIONS.tatami.unitSizeMm);
            const [baseDraft, setBaseDraft] = useState({
                w: Math.round(9100 / MODULE_OPTIONS.tatami.unitSizeMm),
                h: Math.round(9100 / MODULE_OPTIONS.tatami.unitSizeMm)
            });
            const [startMode, setStartMode] = useState('rooms');
            const [floorCount, setFloorCount] = useState(1);
            const [view, setView] = useState({ x: 0, y: 0, scale: 1 });
            const [interactionMode, setInteractionMode] = useState(null);
            const [showOpenModal, setShowOpenOptions] = useState(false);
            const [showMobileTools, setShowMobileTools] = useState(true);
            const fileInputRef = useRef(null);

            const mainRef = useRef(null);
            const canvasRef = useRef(null);
            const interactionRef = useRef({ 
                startX: 0, startY: 0, initialX: 0, initialY: 0, initialW: 0, initialH: 0, initialViewX: 0, initialViewY: 0, startDist: 0, initialScale: 1, linkedFurniture: []
            });

            const mmToGrid = (mm) => Math.max(1, Math.round((Number(mm) || 0) / unitSizeMm));
            const gridToMm = (grid) => Math.round((Number(grid) || 0) * unitSizeMm);
            const legacyGridToCurrent = (grid) => Math.max(1, Math.round((Number(grid) || 0) * LEGACY_UNIT_SIZE_MM / unitSizeMm));
            const legacyPositionToCurrent = (grid) => Math.round((Number(grid) || 0) * LEGACY_UNIT_SIZE_MM / unitSizeMm);
            const gridPixels = GRID_PIXELS * unitSizeMm / LEGACY_UNIT_SIZE_MM;
            const snapToGrid = (value) => Math.round(value);

            const calculateArea = (w, h) => {
                const unitMeters = unitSizeMm / 1000;
                const sqm = (w * unitMeters * h * unitMeters).toFixed(2);
                const tatami = (sqm / 1.62).toFixed(1);
                const tsubo = (sqm / 3.305785).toFixed(2);
                const mWidth = (w * unitMeters).toFixed(2);
                const mHeight = (h * unitMeters).toFixed(2);
                return { sqm, tatami, tsubo, mWidth, mHeight };
            };

            const selectModule = (nextKey) => {
                const nextModule = MODULE_OPTIONS[nextKey];
                if (!nextModule || elements.length > 0) return;
                setBaseDraft(current => ({
                    w: Math.max(1, Math.round(current.w * unitSizeMm / nextModule.unitSizeMm)),
                    h: Math.max(1, Math.round(current.h * unitSizeMm / nextModule.unitSizeMm))
                }));
                setModuleKey(nextModule.key);
                setUnitSizeMm(nextModule.unitSizeMm);
            };

            const normalizeRotation = (rotation) => ((Number(rotation) || 0) % 360 + 360) % 360;

            const getVisualSize = (item) => {
                const w = Number(item.w);
                const h = Number(item.h);
                const rotation = normalizeRotation(item.rotation);
                return rotation === 90 || rotation === 270 ? { w: h, h: w } : { w, h };
            };

            const isFurnitureInsideRoom = (furniture, room) => {
                if (!furniture || !room || furniture.type !== 'furniture' || room.type !== 'room') return false;
                const furnitureSize = getVisualSize(furniture);
                const roomSize = getVisualSize(room);
                const furnitureCenterX = Number(furniture.x) + furnitureSize.w / 2;
                const furnitureCenterY = Number(furniture.y) + furnitureSize.h / 2;
                const roomLeft = Number(room.x);
                const roomTop = Number(room.y);
                return furnitureCenterX >= roomLeft && furnitureCenterX <= roomLeft + roomSize.w && furnitureCenterY >= roomTop && furnitureCenterY <= roomTop + roomSize.h;
            };

            const getLinkedFurniture = (room, sourceElements = elements) => {
                if (!room || room.type !== 'room') return [];
                return sourceElements
                    .filter(item => isFurnitureInsideRoom(item, room))
                    .map(item => ({
                        id: item.id,
                        initialX: Number(item.x),
                        initialY: Number(item.y),
                        initialW: Number(item.w),
                        initialH: Number(item.h),
                        initialRotation: Number(item.rotation) || 0
                    }));
            };

            const rotateLinkedFurniture = (room, sourceElements = elements) => {
                const linkedFurniture = getLinkedFurniture(room, sourceElements);
                if (linkedFurniture.length === 0) {
                    return item => item.id === room.id ? { ...item, rotation: (item.rotation + 90) % 360 } : item;
                }

                return item => {
                    const nextRoomRotation = (normalizeRotation(room.rotation) + 90) % 360;
                    if (item.id === room.id) return { ...item, rotation: nextRoomRotation };
                    const linked = linkedFurniture.find(furniture => furniture.id === item.id);
                    if (!linked) return item;

                    const roomSize = getVisualSize(room);
                    const furnitureSize = getVisualSize({
                        ...item,
                        w: linked.initialW,
                        h: linked.initialH,
                        rotation: linked.initialRotation
                    });
                    const relX = linked.initialX - Number(room.x);
                    const relY = linked.initialY - Number(room.y);

                    return {
                        ...item,
                        x: Math.round(Number(room.x) + roomSize.h - relY - furnitureSize.h),
                        y: Math.round(Number(room.y) + relX),
                        rotation: (linked.initialRotation + 90) % 360
                    };
                };
            };

            const exportProject = () => {
                if (elements.length === 0) return;
                const data = JSON.stringify({ elements, baseDraft, moduleKey, unitSizeMm, timestamp: new Date().toISOString() }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `間取り案_${new Date().toISOString().slice(0,10)}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const loadProjectData = (parsed) => {
                if (parsed.elements) {
                    const loadedUnitSizeMm = Number(parsed.unitSizeMm) || LEGACY_UNIT_SIZE_MM;
                    const loadedModule = Object.values(MODULE_OPTIONS).find(option => option.unitSizeMm === loadedUnitSizeMm);
                    setElements(parsed.elements);
                    if (parsed.baseDraft) setBaseDraft(parsed.baseDraft);
                    setUnitSizeMm(loadedUnitSizeMm);
                    setModuleKey(parsed.moduleKey || loadedModule?.key || 'legacy');
                    setSelectedId(null);
                    setTimeout(resetView, 100);
                }
            };

            const handleFileImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        loadProjectData(parsed);
                        setShowOpenOptions(false);
                    } catch (err) {
                        alert("有効なプロジェクトファイルではありません。");
                    }
                };
                reader.readAsText(file);
                e.target.value = ""; 
            };

            const loadPreset = () => {
                loadProjectData(PRESET_PLAN);
                setShowOpenOptions(false);
            };

            const resetView = useCallback(() => {
                if (!mainRef.current) return;
                const bases = elements.filter(e => e.type === 'base');
                if (bases.length === 0) return;
                const padding = 100;
                const availW = mainRef.current.clientWidth - padding;
                const availH = mainRef.current.clientHeight - padding;
                const minX = Math.min(...bases.map(base => Number(base.x) || 0));
                const minY = Math.min(...bases.map(base => Number(base.y) || 0));
                const maxX = Math.max(...bases.map(base => (Number(base.x) || 0) + getVisualSize(base).w));
                const maxY = Math.max(...bases.map(base => (Number(base.y) || 0) + getVisualSize(base).h));
                const contentW = Math.max(1, maxX - minX) * gridPixels;
                const contentH = Math.max(1, maxY - minY) * gridPixels;
                const newScale = Math.min(availW / contentW, availH / contentH, 1.2);
                setView({
                    x: (mainRef.current.clientWidth - contentW * newScale) / 2 - minX * gridPixels * newScale,
                    y: (mainRef.current.clientHeight - contentH * newScale) / 2 - minY * gridPixels * newScale,
                    scale: isFinite(newScale) ? newScale : 1
                });
            }, [elements, gridPixels]);

            const baseCount = elements.filter(element => element.type === 'base').length;
            useEffect(() => {
                if (baseCount === 0) return;
                const frameId = window.requestAnimationFrame(resetView);
                return () => window.cancelAnimationFrame(frameId);
            }, [baseCount]);

            useEffect(() => {
                const handleResize = () => window.requestAnimationFrame(resetView);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, [resetView]);

            const createRandomRooms = (base, firstId) => {
                const labels = ['リビング', 'ダイニング', 'キッチン', '洗面', '風呂', 'トイレ', 'ランドリー', '玄関'];
                const templates = labels
                    .map(label => ROOM_DATA.find(room => room.label === label))
                    .filter(Boolean);
                const shuffled = [...templates].sort(() => Math.random() - 0.5);
                const baseW = Math.max(1, Number(base.w));
                const baseH = Math.max(1, Number(base.h));
                let bestPlaced = [];

                for (let attempt = 0; attempt < 8; attempt += 1) {
                    const scale = Math.pow(0.88, attempt);
                    const placed = [];
                    let failed = false;

                    for (const room of shuffled) {
                        const w = Math.min(baseW, Math.max(1, Math.round(legacyGridToCurrent(room.defaultW) * scale)));
                        const h = Math.min(baseH, Math.max(1, Math.round(legacyGridToCurrent(room.defaultH) * scale)));
                        let position = null;
                        const fits = (x, y) => !placed.some(item =>
                            x < item.x + item.w && x + w > item.x && y < item.y + item.h && y + h > item.y
                        );

                        for (let trial = 0; trial < 240 && !position; trial += 1) {
                            const x = Math.floor(Math.random() * Math.max(1, baseW - w + 1));
                            const y = Math.floor(Math.random() * Math.max(1, baseH - h + 1));
                            if (fits(x, y)) position = { x, y };
                        }
                        for (let y = 0; y <= baseH - h && !position; y += 1) {
                            for (let x = 0; x <= baseW - w && !position; x += 1) {
                                if (fits(x, y)) position = { x, y };
                            }
                        }

                        if (!position) {
                            if (placed.length > bestPlaced.length) bestPlaced = placed;
                            failed = true;
                            break;
                        }
                        placed.push({
                            ...room,
                            id: firstId + placed.length,
                            x: Number(base.x) + position.x,
                            y: Number(base.y) + position.y,
                            w,
                            h,
                            rotation: 0
                        });
                        if (placed.length > bestPlaced.length) bestPlaced = placed;
                    }
                    if (!failed) return placed;
                }
                return bestPlaced;
            };

            const addElement = (proto) => {
                const id = Date.now();
                const newEl = {
                    id, label: proto.label, x: 4, y: 4, 
                    w: legacyGridToCurrent(proto.defaultW || 4), h: legacyGridToCurrent(proto.defaultH || 4),
                    color: proto.color, type: proto.type, rotation: 0, isFixed: proto.type === 'base'
                };

                if (proto.type === 'base') {
                    const floorGap = Math.max(4, Math.round(legacyGridToCurrent(8)));
                    const bases = Array.from({ length: floorCount }, (_, index) => ({
                        ...newEl,
                        id: id + index,
                        x: index * (Number(baseDraft.w) + floorGap),
                        y: 0,
                        w: Number(baseDraft.w),
                        h: Number(baseDraft.h),
                        floor: index + 1,
                        floorLabel: `${index + 1}F`
                    }));
                    const initialRooms = startMode === 'rooms'
                        ? createRandomRooms(bases[0], id + floorCount + 1)
                        : [];
                    setElements([...bases, ...initialRooms]);
                    setShowMobileTools(false);
                    setTimeout(resetView, 50);
                } else {
                    setElements(prev => [...prev, newEl]);
                }
                setSelectedId(proto.type === 'base' ? null : id);
            };

            const addCustomElement = (type) => {
                const name = window.prompt(`${type === 'room' ? '部屋' : '家具'}の名前を入力してください`, '');
                if (!name) return;
                const randomPalette = COLOR_PALETTES[Math.floor(Math.random() * COLOR_PALETTES.length)];
                const proto = {
                    label: name,
                    defaultW: type === 'room' ? 8 : 4,
                    defaultH: type === 'room' ? 8 : 4,
                    color: `${randomPalette.bg} ${randomPalette.border}`,
                    type: type
                };
                addElement(proto);
            };

            const onPointerDown = (e) => {
                const touches = e.nativeEvent instanceof TouchEvent ? e.nativeEvent.touches : null;
                if (touches && touches.length === 2) {
                    const dist = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
                    interactionRef.current = { ...interactionRef.current, startDist: dist, initialScale: view.scale };
                    setInteractionMode('zoom');
                    return;
                }

                const clientX = e.clientX;
                const clientY = e.clientY;
                const target = e.target.closest('[data-id]');
                const action = e.target.closest('[data-action]')?.dataset.action;

                if (target) {
                    const id = parseInt(target.dataset.id);
                    const el = elements.find(item => item.id === id);
                    if (!el) return;

                    if (el.type === 'base') {
                        setSelectedId(null);
                        setInteractionMode('pan');
                        interactionRef.current = { ...interactionRef.current, startX: clientX, startY: clientY, initialViewX: view.x, initialViewY: view.y };
                        return;
                    }

                    setSelectedId(id);
                    if (action === 'resize') {
                        setInteractionMode('resize');
                        interactionRef.current = { ...interactionRef.current, startX: clientX, startY: clientY, initialW: Number(el.w), initialH: Number(el.h), linkedFurniture: [] };
                    } else {
                        setInteractionMode('move');
                        interactionRef.current = { ...interactionRef.current, startX: clientX, startY: clientY, initialX: Number(el.x), initialY: Number(el.y), linkedFurniture: getLinkedFurniture(el) };
                    }
                } else {
                    setSelectedId(null);
                    setInteractionMode('pan');
                    interactionRef.current = { ...interactionRef.current, startX: clientX, startY: clientY, initialViewX: view.x, initialViewY: view.y };
                }
                e.target.setPointerCapture(e.pointerId);
            };

            const onPointerMove = useCallback((e) => {
                if (!interactionMode) return;
                const touches = e.nativeEvent instanceof TouchEvent ? e.nativeEvent.touches : null;
                
                if (interactionMode === 'zoom' && touches?.length === 2) {
                    const dist = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
                    const ratio = dist / interactionRef.current.startDist;
                    setView(v => ({ ...v, scale: Math.min(Math.max(interactionRef.current.initialScale * ratio, 0.2), 4) }));
                    return;
                }

                const clientX = e.clientX;
                const clientY = e.clientY;

                if (interactionMode === 'pan') {
                    setView(v => ({
                        ...v,
                        x: interactionRef.current.initialViewX + (clientX - interactionRef.current.startX),
                        y: interactionRef.current.initialViewY + (clientY - interactionRef.current.startY)
                    }));
                } else if (interactionMode === 'move' || interactionMode === 'resize') {
                    const dx_grid = (clientX - interactionRef.current.startX) / (view.scale * gridPixels);
                    const dy_grid = (clientY - interactionRef.current.startY) / (view.scale * gridPixels);

                    setElements(prev => prev.map(el => {
                        if (interactionMode === 'move') {
                            if (el.id === selectedId) {
                                return {
                                    ...el,
                                    x: snapToGrid(interactionRef.current.initialX + dx_grid),
                                    y: snapToGrid(interactionRef.current.initialY + dy_grid)
                                };
                            }
                            const linked = interactionRef.current.linkedFurniture.find(furniture => furniture.id === el.id);
                            if (linked) {
                                return {
                                    ...el,
                                    x: snapToGrid(linked.initialX + dx_grid),
                                    y: snapToGrid(linked.initialY + dy_grid)
                                };
                            }
                            return el;
                        }
                        if (el.id !== selectedId) return el;
                        return {
                            ...el,
                            w: Math.max(1, snapToGrid(interactionRef.current.initialW + dx_grid)),
                            h: Math.max(1, snapToGrid(interactionRef.current.initialH + dy_grid))
                        };
                    }));
                }
            }, [interactionMode, selectedId, view.scale, gridPixels]);

            const onPointerUp = (e) => {
                setInteractionMode(null);
                if (e.target.hasPointerCapture(e.pointerId)) e.target.releasePointerCapture(e.pointerId);
            };

            const exportPNG = async () => {
                if (!baseEl || !window.html2canvas) return;

                const marginPx = EXPORT_MARGIN_GRID * gridPixels;
                const bases = elements.filter(el => el.type === 'base');
                const minX = Math.min(...bases.map(base => Number(base.x) || 0));
                const minY = Math.min(...bases.map(base => Number(base.y) || 0));
                const maxX = Math.max(...bases.map(base => (Number(base.x) || 0) + getVisualSize(base).w));
                const maxY = Math.max(...bases.map(base => (Number(base.y) || 0) + getVisualSize(base).h));
                const exportWidth = (maxX - minX + EXPORT_MARGIN_GRID * 2) * gridPixels;
                const exportHeight = (maxY - minY + EXPORT_MARGIN_GRID * 2) * gridPixels;
                const exportRoot = document.createElement('div');
                exportRoot.style.position = 'fixed';
                exportRoot.style.left = '0';
                exportRoot.style.top = '0';
                exportRoot.style.width = `${exportWidth}px`;
                exportRoot.style.height = `${exportHeight}px`;
                exportRoot.style.overflow = 'hidden';
                exportRoot.style.backgroundColor = '#ffffff';
                exportRoot.style.pointerEvents = 'none';
                exportRoot.style.zIndex = '-1';
                exportRoot.style.backgroundImage = `
                    linear-gradient(to right, #f1f5f9 1px, transparent 1px), linear-gradient(to bottom, #f1f5f9 1px, transparent 1px),
                    linear-gradient(to right, #e2e8f0 1.5px, transparent 1.5px), linear-gradient(to bottom, #e2e8f0 1.5px, transparent 1.5px)
                `;
                exportRoot.style.backgroundSize = `${gridPixels}px ${gridPixels}px, ${gridPixels}px ${gridPixels}px, ${gridPixels * 2}px ${gridPixels * 2}px, ${gridPixels * 2}px ${gridPixels * 2}px`;
                exportRoot.style.backgroundPosition = `${marginPx}px ${marginPx}px`;

                const exportContent = document.createElement('div');
                exportContent.style.position = 'relative';
                exportContent.style.width = '100%';
                exportContent.style.height = '100%';
                exportRoot.appendChild(exportContent);

                sortedElements.forEach(el => {
                    const node = document.createElement('div');
                    const isBase = el.type === 'base';
                    node.dataset.exportType = el.type;
                    node.className = `absolute flex flex-col items-center justify-center border-2 ${el.color} ${isBase ? 'border-dashed border-slate-300 shadow-2xl bg-white/80' : 'border-opacity-50 shadow-sm'} ${el.type === 'furniture' ? 'rounded-2xl opacity-90' : 'rounded-sm'}`;
                    const style = getElementStyle({
                        ...el,
                        x: Number(el.x) - minX + EXPORT_MARGIN_GRID,
                        y: Number(el.y) - minY + EXPORT_MARGIN_GRID
                    });
                    Object.assign(node.style, {
                        left: `${style.left}px`,
                        top: `${style.top}px`,
                        width: `${style.width}px`,
                        height: `${style.height}px`,
                        transform: style.transform,
                        transformOrigin: style.transformOrigin
                    });

                    if (!isBase) {
                        const labelWrap = document.createElement('div');
                        labelWrap.className = 'text-center p-1 pointer-events-none w-full overflow-hidden';
                        const label = document.createElement('span');
                        label.className = 'font-black text-slate-800 text-[11px] leading-none block';
                        label.textContent = el.label;
                        labelWrap.appendChild(label);

                        if (el.type === 'room') {
                            const { sqm, tatami, mWidth, mHeight } = calculateArea(el.w, el.h);
                            const sizeWrap = document.createElement('div');
                            sizeWrap.className = 'mt-1 space-y-0.5';
                            const area = document.createElement('span');
                            area.className = 'text-[9px] text-slate-500 block font-black uppercase tracking-tighter leading-none';
                            area.textContent = `${tatami}畳 / ${sqm}㎡`;
                            const dimensions = document.createElement('span');
                            dimensions.className = 'text-[8px] text-indigo-400 block font-black leading-none';
                            dimensions.textContent = `${mWidth}m × ${mHeight}m`;
                            sizeWrap.append(area, dimensions);
                            labelWrap.appendChild(sizeWrap);
                        }

                        node.appendChild(labelWrap);
                    }

                    exportContent.appendChild(node);
                });
                bases.forEach(base => {
                    if (!base.floorLabel) return;
                    const floorLabel = document.createElement('div');
                    floorLabel.className = 'absolute rounded-lg bg-slate-900 px-3 py-1.5 text-sm font-black text-white shadow-lg';
                    floorLabel.style.left = `${(Number(base.x) - minX + EXPORT_MARGIN_GRID) * gridPixels + 8}px`;
                    floorLabel.style.top = `${(Number(base.y) - minY + EXPORT_MARGIN_GRID) * gridPixels + 8}px`;
                    floorLabel.textContent = base.floorLabel;
                    exportContent.appendChild(floorLabel);
                });

                document.body.appendChild(exportRoot);
                try {
                    const capture = await html2canvas(exportRoot, { scale: 2, backgroundColor: "#ffffff" });
                    const link = document.createElement('a');
                    link.download = 'floor_plan.png';
                    link.href = capture.toDataURL();
                    link.click();
                } finally {
                    exportRoot.remove();
                }
            };

            const sortedElements = useMemo(() => {
                const order = { 'base': 0, 'room': 1, 'furniture': 2 };
                return [...elements].sort((a, b) => order[a.type] - order[b.type]);
            }, [elements]);

            const selectedEl = elements.find(e => e.id === selectedId);
            const baseEl = elements.find(e => e.type === 'base');
            const baseArea = calculateArea(baseEl?.w ?? baseDraft.w, baseEl?.h ?? baseDraft.h);

            // CAD方式: 左上角を固定して回転
            const getElementStyle = (el) => {
                const x = (Number(el.x) || 0) * gridPixels;
                const y = (Number(el.y) || 0) * gridPixels;
                const w = (Number(el.w) || 1) * gridPixels;
                const h = (Number(el.h) || 1) * gridPixels;
                
                let transform = `rotate(${el.rotation}deg)`;
                if (el.rotation === 90) transform += ` translateY(-100%)`;
                else if (el.rotation === 180) transform += ` translate(-100%, -100%)`;
                else if (el.rotation === 270) transform += ` translateX(-100%)`;

                return {
                    left: x,
                    top: y,
                    width: w,
                    height: h,
                    transform: transform,
                    transformOrigin: 'top left'
                };
            };

            return (
                <div className="app-shell flex flex-col bg-slate-100 overflow-hidden font-sans select-none text-slate-900">
                    <header className="bg-white border-b border-slate-200 px-3 sm:px-6 py-2 sm:py-3 flex justify-between items-center z-50 shrink-0 shadow-sm">
                        <div className="flex items-center gap-2 sm:gap-3 min-w-0">
                            <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shrink-0"><SvgIcon name="Home" size={22} /></div>
                            <div>
                                <h1 className="text-sm sm:text-lg font-bold leading-tight whitespace-nowrap">間取りスケッチャー</h1>
                                <p className="hidden sm:block text-[10px] text-indigo-500 font-black uppercase tracking-tighter">Preset & Origin Sync v2.1</p>
                            </div>
                        </div>
                        <div className="hidden sm:flex gap-2">
                            <input type="file" ref={fileInputRef} onChange={handleFileImport} accept=".json" className="hidden" />
                            
                            <button onClick={() => setShowOpenOptions(true)} className="bg-white border border-slate-200 px-4 py-2 rounded-xl flex items-center gap-2 text-xs font-bold hover:bg-slate-50 transition-all shadow-sm">
                                <SvgIcon name="Upload" size={16}/><span>開く</span>
                            </button>
                            
                            <button onClick={exportProject} className="bg-white border border-slate-200 px-4 py-2 rounded-xl flex items-center gap-2 text-xs font-bold hover:bg-slate-50 transition-all shadow-sm">
                                <SvgIcon name="FileJson" size={16}/><span>プロジェクト保存</span>
                            </button>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <PasswordGate>
                <App />
            </PasswordGate>
        );
    </script>
</body>
</html>
